<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eddf"/>
      <stop offset="0.5" stop-color="#eee3d0"/>
      <stop offset="1" stop-color="#e8dbc6"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#382f25" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1000" height="1500" fill="url(#paper)"/>
  <rect x="42" y="42" width="916" height="1416" rx="4" fill="none" stroke="#5d6f58" stroke-width="5"/>
  <rect x="62" y="62" width="876" height="1376" rx="3" fill="none" stroke="#b4a785" stroke-width="2"/>
  <g filter="url(#grain)"><rect x="0" y="0" width="1000" height="1500" fill="transparent"/></g>

  <g fill="none" stroke="#5d6f58" stroke-width="6" stroke-linecap="round">
