  <text x="500" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="5.5" fill="#7e6a4f">WRITE NOW PUBLISHING HOUSE</text>
  <text x="500" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" fill="#6c5d4a">a recovered storybook</text>
  <text x="500" y="475" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="700" fill="#314536">THE WISH FAIRY</text>
  <text x="500" y="565" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#314536">AND DEWY DEAR</text>

